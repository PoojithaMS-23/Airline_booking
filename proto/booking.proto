syntax = "proto3";

// Distributed airline reservation — gRPC service contract.
// Protobuf handles data marshalling (binary serialization) over the network.

service ReservationService {
  rpc CheckAvailability (AvailabilityRequest) returns (AvailabilityResponse);
  rpc BookSeat (BookingRequest) returns (BookingResponse);
  rpc CancelReservation (CancelRequest) returns (CancelResponse);
}

message AvailabilityRequest {
  string flight_id = 1;
}

message SeatInfo {
  string seat_no = 1;
  string status = 2;  // AVAILABLE | HOLD | BOOKED
}

message AvailabilityResponse {
  repeated SeatInfo seats = 1;
}

message BookingRequest {
  string user_id = 1;
  string flight_id = 2;
  string seat_no = 3;
}

message BookingResponse {
  bool success = 1;
  string message = 2;
  string booking_id = 3;
  string hold_id = 4;
  int32 hold_seconds = 5;
}

message CancelRequest {
  string flight_id = 1;
  string seat_no = 2;
}

message CancelResponse {
  bool success = 1;
  string message = 2;
}
